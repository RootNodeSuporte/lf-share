<style>
  :root{
    --bg: #fbfbfa;
    --green: #52ae31;
    --green-dark: #43931f;
    --green-soft: rgba(82, 174, 49, 0.12);
    --ink: #0d0d0d;
    --ink-dim: #55524f;
    --ink-faint: #9a9794;
    --pulse: #c3c3c3;
    --line: rgba(13, 13, 13, 0.12);
    --radius: 8px;
  }

  *{ box-sizing: border-box; }

  html, body{ margin: 0; padding: 0; min-height: 100%; }

  body{
    background:
      radial-gradient(ellipse 620px 480px at 50% 8%, rgba(82, 174, 49, 0.10), transparent 65%),
      var(--bg);
    color: var(--ink);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 40px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* linha de pulso do ícone, atravessando a página */
  .pulse{
    position: fixed;
    left: 0;
    top: 50%;
    width: 100%;
    height: 220px;
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 0;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 calc(50% - 250px), transparent calc(50% - 205px), transparent calc(50% + 205px), #000 calc(50% + 250px), #000 100%);
            mask-image: linear-gradient(90deg, #000 0%, #000 calc(50% - 250px), transparent calc(50% - 205px), transparent calc(50% + 205px), #000 calc(50% + 250px), #000 100%);
  }
  @media (max-width: 520px){
    .pulse{ opacity: 0.35; -webkit-mask-image: none; mask-image: none; top: auto; bottom: 0; transform: none; height: 140px; }
  }
  .pulse path{
    fill: none;
    stroke: var(--pulse);
    stroke-width: 1.5;
    stroke-linejoin: miter;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 2600;
    stroke-dashoffset: 2600;
    animation: draw 2.4s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
    opacity: 0.7;
  }

  .card{
    width: 100%;
    max-width: 380px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .mark{
    width: 148px;
    height: 148px;
    margin: 0 auto 24px;
    opacity: 0;
    transform: translateY(10px) scale(0.96);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
  }

  .mark img{
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 33px;
    background: #fff;
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.12),
      0 4px 10px rgba(0, 0, 0, 0.06),
      0 0 0 1px rgba(0, 0, 0, 0.06);
  }

  h1{
    font-weight: 800;
    font-size: clamp(2.4rem, 11vw, 3.1rem);
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 6px 0 10px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.16s forwards;
  }
  h1 .dot{ color: var(--green); }

  .tagline{
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--green-dark);
    margin: 0 0 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.24s forwards;
  }

  p.desc{
    font-size: 0.96rem;
    line-height: 1.6;
    color: var(--ink-dim);
    max-width: 30ch;
    margin: 0 auto 30px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.32s forwards;
  }

  .stores{
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  .store-btn{
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    padding: 14px 20px;
    border-radius: var(--radius);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.96rem;
    border: 1px solid var(--line);
    color: var(--ink);
    background: #fff;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }

  .store-btn svg{ flex: none; width: 20px; height: 20px; }

  .store-btn:hover{
    border-color: rgba(13, 13, 13, 0.28);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
  }

  .store-btn:active{ transform: scale(0.985); }

  .store-btn.primary{
    background: var(--green);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 8px 22px rgba(82, 174, 49, 0.28);
  }

  .store-btn.primary:hover{ background: var(--green-dark); }

  .store-btn:focus-visible{
    outline: 2px solid var(--green);
    outline-offset: 3px;
  }

  footer{
    margin-top: 34px;
    font-size: 0.76rem;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  @keyframes rise{ to{ opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }

  @media (prefers-reduced-motion: reduce){
    .mark, h1, .tagline, p.desc, .stores, footer{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .pulse path{ animation: none !important; stroke-dashoffset: 0 !important; }
  }

  @media (max-width: 340px){
    .mark{ width: 128px; height: 128px; }
  }
</style>
</head>
